# Speaches：OpenAI 兼容的语音识别（faster-whisper）和语音合成（Kokoro、Piper）服务，
# 网页和接口是同一个端口。上游官方镜像只发到 CUDA 12.6（ghcr.io/speaches-ai/speaches
# 的 *-cuda 标签），RTX 50 系（sm_120）要 CUDA 12.8 的运行库，所以用 images/speaches/
# 的自建镜像：上游 Dockerfile 只改基础镜像（官方 CUDA 12.8）和取源方式，不改上游代码。
services:
  # 一次性：数据目录的卷会盖住镜像里预建的 ~/.cache/huggingface/hub，全新安装时
  # huggingface_hub 扫缓存直接 CacheNotFound 起不来；先在卷里把目录建出来。
  init-hub:
    image: ghcr.io/geraldpeng6/speaches:0.1.0@sha256:8acf2d605cfee5b7f760569d8e424d3dcb0b975d21a89dd689278e6789566840
    command: ["mkdir", "-p", "/home/ubuntu/.cache/huggingface/hub"]
    user: "1000:1000"
    volumes:
      - ${WONTON_APP_DATA}/huggingface:/home/ubuntu/.cache/huggingface
    network_mode: none
    restart: "no"

  speaches:
    # 审查时镜像还没发布，没有摘要；构建命令见 README（发布由 publish.sh 推送并按摘要固定）。
    image: ghcr.io/geraldpeng6/speaches:0.1.0@sha256:8acf2d605cfee5b7f760569d8e424d3dcb0b975d21a89dd689278e6789566840
    # 上游镜像固定以 ubuntu（uid 1000）运行，写死 user 让数据目录属主和它一致（不跟 PUID 走）。
    user: "1000:1000"
    depends_on:
      init-hub:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 上游默认端口 8000 是最常被占用的端口之一，而局域网端口不做映射（宿主端口 = 容器端口），
      # 换成 8300，避开宿主上常见的服务端口。
      UVICORN_PORT: "8300"
      # 上游默认 debug 日志，量太大。
      LOG_LEVEL: info
      # 网页的模型下拉经 OpenAI 客户端回连本服务；不设这个时它用浏览器的公网地址，
      # 容器里解析不了，下拉全是 Error。指到容器自己的 API（和健康检查同一地址）。
      LOOPBACK_HOST_URL: http://127.0.0.1:8300
      # 局域网端口上 curl 健康检查访问的是本机；核心给出网插件注入的代理变量不豁免本机地址，
      # 会把健康检查送进代理。只豁免本机，模型下载（huggingface.co）照常走代理。
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    volumes:
      # 模型在首次使用时经 Hugging Face 下载，重装、升级不丢；规范只允许挂插件自己的数据目录，
      # 多个插件共用一份模型缓存需要底座支持（见 PR“底座的问题”）。
      - ${WONTON_APP_DATA}/huggingface:/home/ubuntu/.cache/huggingface
    # 查的是 API 真的能答话（列模型），不只是进程活着；/health 是静态 200，查不出初始化问题。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8300/v1/models"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      start_interval: 5s

x-wonton:
  spec: "0.6"
  # 反向域名：上游官网 speaches.ai。
  id: ai.speaches.speaches
  version: 0.1.0
  kind: app
  title: { en: Speaches }
  description:
    zh: 在自己家的显卡上转文字、发语音，OpenAI 兼容接口
    en: Speech-to-text and text-to-speech on your own GPU, with an OpenAI-compatible API
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/ui-1.png, screenshots/ui-2.png, screenshots/ui-3.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://speaches.ai
  # 上游 Speaches 的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: MIT
  tags:
    zh: [AI, 语音]
    en: [AI, Speech]
  about:
    zh: |
      把语音模型装在自己家里：录音转成文字（Whisper），文字念成语音（Kokoro、Piper），
      接口和 OpenAI 的一样，写过的代码直接换地址就能用。

      有 NVIDIA 显卡就用显卡，模型在第一次用到时自动下载、用完自动卸载。
      默认模型：识别用 faster-whisper-large-v3（约 3.1 GB，占约 4 GB 显存），
      合成用 Kokoro-82M（约 330 MB，占不到 1 GB 显存），32 GB 显存可以同时跑，
      最低 6 GB 显存的显卡也够用。

      网页在这里打开就能用；给其他设备或软件用的接口地址是
      http://<这台主机的局域网地址>:8300/v1（在插件设置里打开局域网开关）。
      网页经云吞网关访问，只有登录的用户进得来；局域网接口不经过网关，和 Ollama 一样
      不设密码，只在家里网络用。
    en: |
      Run speech models on your own hardware: turn recordings into text (Whisper) and text
      into speech (Kokoro, Piper). The API is OpenAI-compatible — point existing code at it
      and it works.

      Uses your NVIDIA GPU when there is one. Models download on first use and unload when
      idle. Defaults: faster-whisper-large-v3 for recognition (about 3.1 GB on disk, about
      4 GB of VRAM) and Kokoro-82M for synthesis (about 330 MB, under 1 GB of VRAM); both
      fit together in 32 GB, and 6 GB of VRAM is enough.

      Open the web UI here; for other devices and apps the API address is
      http://<your-host-LAN-address>:8300/v1 (enable the LAN switch in the plugin settings).
      The web UI sits behind the Wonton gateway, only signed-in users get in; the LAN API
      bypasses the gateway and, like Ollama, has no password — use it on a home network.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: speaches
    port: 8300
  # 应用没有用户体系，网页交给网关挡着（sso 默认 none）；接口给局域网设备直连（和 Ollama 的 API 同一做法）。
  lan:
    ports:
      - { service: speaches, port: 8300 }
  # 出网：模型从 huggingface.co 下载。
  # 局域网：接口要给局域网里的设备和软件直连。
  permissions:
    - devices.gpu
    - network.egress
    - network.lan
  # 显卡给 speaches；上游按请求动态加载/卸载模型，没有显卡跑不了推理，所以是必需。
  gpu:
    services: [speaches]
  requirements:
    # 镜像只有 amd64：onnxruntime-gpu 没有 arm64 的 wheel（上游 uv.lock 固定）。
    arch: [amd64]
    # 上游没写最低内存；实测空闲约 0.5 GiB，加载 large-v3 时的峰值加余量取 4G（见 PR）。
    memory: 4G
    gpu: { need: required, vendors: [nvidia], memory: 6G }
